<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Campo — Leitor de Etiquetas HUEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.2/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --paper: #EFE9D8;
    --paper-dark: #E3DBC2;
    --ink: #243128;
    --ink-soft: #5B6459;
    --moss: #52684F;
    --moss-dark: #3E4F3B;
    --rust: #A6693C;
    --line: #C9BFA0;
    --error: #A6402E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; padding-bottom: 88px; min-height: 100vh; }

  header {
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .capture-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 3px;
    padding: 11px 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s ease;
  }
  .btn:active { opacity: 0.75; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--moss); color: var(--paper); flex: 1; }
  .btn-secondary { background: transparent; color: var(--moss-dark); border: 1px solid var(--moss); flex: 1; }
  .btn-rust { background: var(--rust); color: var(--paper); }
  input[type="file"] { display: none; }

  .status {
    padding: 14px 20px;
    font-size: 13px;
    color: var(--moss-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--moss);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .review {
    padding: 18px 20px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-dark);
  }
  .review-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--moss-dark);
    font-weight: 600;
    margin: 16px 0 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .section-label:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
  .thumb {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 3px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--moss);
  }
  .field-sci input { font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; }
  textarea { resize: vertical; min-height: 60px; font-size: 13px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .review-actions { display: flex; gap: 10px; margin-top: 4px; }

  .ledger { padding: 4px 20px; }
  .ledger-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 0 8px;
  }
  .ledger-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--ink-soft);
  }
  .ledger-count { font-size: 13px; color: var(--ink-soft); }

  .entry {
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    cursor: pointer;
  }
  .entry-top { display: flex; gap: 12px; align-items: flex-start; }
  .entry-thumb {
    width: 48px; height: 48px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-sci {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    margin: 0 0 2px;
    color: var(--ink);
  }
  .entry-tag {
    display: inline-block;
    font-size: 10.5px;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 600;
    color: var(--moss-dark);
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .entry-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-edit { margin-top: 12px; }

  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .export-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }
  .export-bar .btn { width: 100%; }
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <h1>Caderno de Campo</h1>
    <p>Fotografe a etiqueta HUEM de uma amostra. O app lê o texto, você confere os campos, e a amostra entra no caderno — exporte tudo para uma planilha quando quiser.</p>
  </header>

  <div class="capture-bar">
    <button class="btn btn-primary" id="camBtn">Fotografar etiqueta</button>
    <button class="btn btn-secondary" id="uploadBtn">Enviar foto</button>
    <input type="file" id="camInput" accept="image/*" capture="environment">
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div id="statusArea"></div>
  <div id="reviewArea"></div>

  <div class="ledger">
    <div class="ledger-header">
      <h2>Caderno</h2>
      <span class="ledger-count" id="ledgerCount">0 registros</span>
    </div>
    <div id="ledgerList"></div>
  </div>

</div>

<div class="export-bar">
  <button class="btn btn-rust" id="exportBtn" disabled>Exportar para planilha (.xlsx)</button>
</div>

<script>
(function() {
  const STORAGE_KEY = 'specimens';
  let entries = [];
  let pendingReview = null;

  const el = (id) => document.getElementById(id);
  const statusArea = el('statusArea');
  const reviewArea = el('reviewArea');
  const ledgerList = el('ledgerList');
  const ledgerCount = el('ledgerCount');
  const exportBtn = el('exportBtn');

  // ---------- armazenamento ----------
  async function loadEntries() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      entries = result ? JSON.parse(result.value) : [];
    } catch (e) {
      entries = [];
    }
    renderLedger();
  }

  async function saveEntries() {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
      if (!result) console.error('Falha ao salvar');
    } catch (e) {
      console.error('Erro de armazenamento', e);
    }
  }

  // ---------- imagem ----------
  function downscaleImage(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- leitura da etiqueta (modelo HERBÁRIO HUEM - UEM) ----------
  function parseLabel(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const fields = {
      commonName: '', scientificName: '', family: '',
      identifier: '', idDate: '',
      country: '', state: '', municipality: '', locality: '',
      collectionDate: '', collector: '', collectionNumber: '',
      herbariumNumber: '', imageNumber: '', obs: ''
    };

    const grab = (re) => {
      const line = lines.find(l => re.test(l));
      if (!line) return '';
      return line.replace(re, '').trim();
    };

    fields.commonName = grab(/^nome\s+popular\s*:?/i);
    fields.obs = grab(/^obs\.?\s*:?/i);
    fields.country = grab(/^pa[ií]s\s*:?/i);
    fields.state = grab(/^estado\s*:?/i);
    fields.municipality = grab(/^munic[ií]pio\s*:?/i);
    fields.collectionDate = grab(/^data\s*:?/i);
    fields.collector = grab(/^col\.?\s*:?/i);
    fields.collectionNumber = grab(/^n[°ºo]\.?\s*campo\s*:?/i);

    // Det.: nome do identificador[, data]
    const detLine = lines.find(l => /^det\.?\s*:?/i.test(l));
    if (detLine) {
      const rest = detLine.replace(/^det\.?\s*:?/i, '').trim();
      const dm = rest.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{1,2}\s+[A-Za-zçÇ]{3,9}\.?\s+\d{2,4})\b/);
      if (dm) {
        fields.idDate = dm[0];
        fields.identifier = rest.replace(dm[0], '').replace(/,\s*$/, '').trim();
      } else {
        fields.identifier = rest.replace(/,\s*$/, '').trim();
      }
    }

    // local: a descrição às vezes continua na linha seguinte (coordenadas)
    const localIdx = lines.findIndex(l => /^local\s*:?/i.test(l));
    if (localIdx !== -1) {
      let loc = lines[localIdx].replace(/^local\s*:?/i, '').trim();
      const next = lines[localIdx + 1];
      if (next && /\d+\s*[°ºo]\s*\d+['’]/.test(next)) loc = (loc + ' ' + next).trim();
      fields.locality = loc;
    }

    // se "col.: Nome, 123" trouxer o número junto e não houver n° campo separado
    if (fields.collector && !fields.collectionNumber) {
      const parts = fields.collector.split(',');
      if (parts.length > 1 && /^\d+$/.test(parts[1].trim())) {
        fields.collectionNumber = parts[1].trim();
      }
    }

    // nome científico e família, quando presentes
    const sciLine = lines.find(l => /^[A-Z][a-z]{2,}\s+[a-z][a-z\-]{2,}/.test(l) && !/aceae\b/i.test(l));
    if (sciLine) {
      const m = sciLine.match(/^[A-Z][a-z]{2,}\s+[a-z][a-z\-.]{2,}(\s+var\.\s+[a-z\-]+)?/);
      if (m) fields.scientificName = m[0];
    }
    const familyLine = lines.find(l => /aceae\b/i.test(l));
    if (familyLine) {
      const m = familyLine.match(/[A-Za-z]+aceae/i);
      if (m) fields.family = m[0];
    }

    // Números HUEM: "HUEM 37294" / "HUEM: 37294" = registro do herbário
    // "HUEM000031823" (colado, sem espaço) = registro da imagem / código de barras
    const huemMatches = [...text.matchAll(/HUEM(\s*:?\s*)(\d{3,})/gi)];
    huemMatches.forEach(m => {
      const sep = m[1];
      const digits = m[2];
      if (sep === '') {
        if (!fields.imageNumber) fields.imageNumber = 'HUEM' + digits;
      } else {
        if (!fields.herbariumNumber) fields.herbariumNumber = 'HUEM ' + digits;
      }
    });

    fields.rawText = text;
    return fields;
  }

  // ---------- fluxo de OCR ----------
  async function processImage(file) {
    statusArea.innerHTML = '<div class="status"><div class="spinner"></div>Lendo etiqueta…</div>';
    reviewArea.innerHTML = '';
    let imageDataUrl, thumbDataUrl;
    try {
      imageDataUrl = await downscaleImage(file, 1400);
      thumbDataUrl = await downscaleImage(file, 300);
    } catch (err) {
      console.error(err);
      statusArea.innerHTML = '<div class="status" style="color:var(--error)">Não consegui abrir essa foto. Tente novamente.</div>';
      return;
    }

    let ocrText = '';
    let ocrError = '';
    try {
      // Usa o comportamento padrão do Tesseract (worker via blob), que
      // funciona normalmente em sites hospedados de verdade como este.
      const worker = await Tesseract.createWorker('por+eng', 1, {
        logger: () => {}
      });
      const { data } = await worker.recognize(imageDataUrl);
      await worker.terminate();
      ocrText = data.text || '';
    } catch (err) {
      console.error('OCR falhou:', err);
      ocrError = (err && (err.message || err.toString())) || 'Erro desconhecido';
      ocrText = '';
    }

    const fields = parseLabel(ocrText);
    pendingReview = { imageDataUrl: thumbDataUrl, fields };
    if (ocrText.trim()) {
      statusArea.innerHTML = '';
    } else {
      statusArea.innerHTML = `
        <div class="status" style="color:var(--rust); flex-direction:column; align-items:flex-start; gap:4px;">
          <div>A leitura automática não funcionou desta vez — preencha os campos manualmente abaixo.</div>
          ${ocrError ? `<div style="font-size:11px; color:var(--ink-soft); font-family:monospace; word-break:break-all;">Detalhe técnico: ${escapeHtml(ocrError)}</div>` : ''}
        </div>`;
    }
    renderReview();
  }

  function renderReview() {
    if (!pendingReview) { reviewArea.innerHTML = ''; return; }
    const f = pendingReview.fields;
    reviewArea.innerHTML = `
      <div class="review">
        <p class="review-title">Confira os campos</p>
        <img class="thumb" src="${pendingReview.imageDataUrl}" alt="etiqueta da amostra">

        <div class="field"><label>Nome popular</label><input id="f_common" value="${escapeAttr(f.commonName)}" placeholder="—"></div>
        <div class="field field-sci"><label>Nome científico</label><input id="f_sci" value="${escapeAttr(f.scientificName)}" placeholder="Gênero espécie (se houver)"></div>

        <div class="section-label">Determinação</div>
        <div class="row2">
          <div class="field"><label>Det. (identificador)</label><input id="f_ident" value="${escapeAttr(f.identifier)}" placeholder="—"></div>
          <div class="field"><label>Data de determinação</label><input id="f_iddate" value="${escapeAttr(f.idDate)}" placeholder="—"></div>
        </div>

        <div class="section-label">Local</div>
        <div class="row2">
          <div class="field"><label>País</label><input id="f_country" value="${escapeAttr(f.country)}" placeholder="—"></div>
          <div class="field"><label>Estado</label><input id="f_state" value="${escapeAttr(f.state)}" placeholder="—"></div>
        </div>
        <div class="field"><label>Município</label><input id="f_muni" value="${escapeAttr(f.municipality)}" placeholder="—"></div>
        <div class="field"><label>Local (descrição / coordenadas)</label><input id="f_loc" value="${escapeAttr(f.locality)}" placeholder="—"></div>

        <div class="section-label">Coleta</div>
        <div class="row2">
          <div class="field"><label>Data de coleta</label><input id="f_date" value="${escapeAttr(f.collectionDate)}" placeholder="—"></div>
          <div class="field"><label>Coletor (col.)</label><input id="f_coll" value="${escapeAttr(f.collector)}" placeholder="—"></div>
        </div>
        <div class="field"><label>Nº de campo</label><input id="f_num" value="${escapeAttr(f.collectionNumber)}" placeholder="—"></div>

        <div class="section-label">Registro</div>
        <div class="row2">
          <div class="field"><label>Registro no herbário</label><input id="f_herb" value="${escapeAttr(f.herbariumNumber)}" placeholder="HUEM —"></div>
          <div class="field"><label>Registro da imagem</label><input id="f_img" value="${escapeAttr(f.imageNumber)}" placeholder="—"></div>
        </div>

        <div class="field"><label>Observações</label><input id="f_obs" value="${escapeAttr(f.obs)}" placeholder="—"></div>
        <div class="field"><label>Texto bruto do OCR (referência)</label><textarea id="f_raw" readonly>${escapeHtml(f.rawText)}</textarea></div>

        <div class="review-actions">
          <button class="btn btn-primary" id="addBtn">Adicionar ao caderno</button>
          <button class="btn btn-secondary" id="discardBtn">Descartar</button>
        </div>
      </div>
    `;
    el('addBtn').onclick = addPendingToLedger;
    el('discardBtn').onclick = () => { pendingReview = null; reviewArea.innerHTML = ''; };
  }

  function addPendingToLedger() {
    if (!pendingReview) return;
    const entry = {
      id: 'sp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      imageDataUrl: pendingReview.imageDataUrl,
      commonName: el('f_common').value.trim(),
      scientificName: el('f_sci').value.trim(),
      identifier: el('f_ident').value.trim(),
      idDate: el('f_iddate').value.trim(),
      country: el('f_country').value.trim(),
      state: el('f_state').value.trim(),
      municipality: el('f_muni').value.trim(),
      locality: el('f_loc').value.trim(),
      collectionDate: el('f_date').value.trim(),
      collector: el('f_coll').value.trim(),
      collectionNumber: el('f_num').value.trim(),
      herbariumNumber: el('f_herb').value.trim(),
      imageNumber: el('f_img').value.trim(),
      obs: el('f_obs').value.trim(),
      rawText: pendingReview.fields.rawText
    };
    entries.unshift(entry);
    saveEntries();
    pendingReview = null;
    reviewArea.innerHTML = '';
    renderLedger();
  }

  // ---------- caderno ----------
  function renderLedger() {
    ledgerCount.textContent = entries.length + (entries.length === 1 ? ' registro' : ' registros');
    exportBtn.disabled = entries.length === 0;

    if (entries.length === 0) {
      ledgerList.innerHTML = '<div class="empty">Nenhuma amostra registrada ainda. Fotografe uma etiqueta para começar.</div>';
      return;
    }

    ledgerList.innerHTML = entries.map(e => {
      const title = e.scientificName || e.commonName || 'Não identificado';
      const tag = e.herbariumNumber ? `<span class="entry-tag">${escapeHtml(e.herbariumNumber)}</span>` : '';
      const meta = [e.collector, e.collectionDate, e.municipality].filter(Boolean).join(' · ') || 'Sem detalhes registrados';
      return `
      <div class="entry" data-id="${e.id}">
        <div class="entry-top">
          <img class="entry-thumb" src="${e.imageDataUrl}" alt="">
          <div class="entry-info">
            <p class="entry-sci">${escapeHtml(title)}${tag}</p>
            <p class="entry-meta">${escapeHtml(meta)}</p>
          </div>
        </div>
        <div class="entry-edit" style="display:none"></div>
      </div>`;
    }).join('');

    ledgerList.querySelectorAll('.entry').forEach(node => {
      node.addEventListener('click', (evt) => {
        if (evt.target.closest('.entry-edit')) return;
        toggleEntryEdit(node.dataset.id, node);
      });
    });
  }

  function toggleEntryEdit(id, node) {
    const editDiv = node.querySelector('.entry-edit');
    if (editDiv.style.display === 'block') { editDiv.style.display = 'none'; editDiv.innerHTML = ''; return; }
    const e = entries.find(x => x.id === id);
    editDiv.innerHTML = `
      <div class="field"><label>Nome popular</label><input class="ed_common" value="${escapeAttr(e.commonName || '')}"></div>
      <div class="field field-sci"><label>Nome científico</label><input class="ed_sci" value="${escapeAttr(e.scientificName)}"></div>
      <div class="row2">
        <div class="field"><label>Det. (identificador)</label><input class="ed_ident" value="${escapeAttr(e.identifier || '')}"></div>
        <div class="field"><label>Data de determinação</label><input class="ed_iddate" value="${escapeAttr(e.idDate || '')}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>País</label><input class="ed_country" value="${escapeAttr(e.country || '')}"></div>
        <div class="field"><label>Estado</label><input class="ed_state" value="${escapeAttr(e.state || '')}"></div>
      </div>
      <div class="field"><label>Município</label><input class="ed_muni" value="${escapeAttr(e.municipality || '')}"></div>
      <div class="field"><label>Local</label><input class="ed_loc" value="${escapeAttr(e.locality)}"></div>
      <div class="row2">
        <div class="field"><label>Data de coleta</label><input class="ed_date" value="${escapeAttr(e.collectionDate)}"></div>
        <div class="field"><label>Coletor</label><input class="ed_coll" value="${escapeAttr(e.collector)}"></div>
      </div>
      <div class="field"><label>Nº de campo</label><input class="ed_num" value="${escapeAttr(e.collectionNumber)}"></div>
      <div class="row2">
        <div class="field"><label>Registro no herbário</label><input class="ed_herb" value="${escapeAttr(e.herbariumNumber || '')}"></div>
        <div class="field"><label>Registro da imagem</label><input class="ed_img" value="${escapeAttr(e.imageNumber || '')}"></div>
      </div>
      <div class="field"><label>Observações</label><input class="ed_obs" value="${escapeAttr(e.obs || '')}"></div>
      <div class="review-actions">
        <button class="btn btn-primary ed_save">Salvar</button>
        <button class="btn btn-secondary ed_delete" style="color:var(--error);border-color:var(--error)">Excluir</button>
      </div>
    `;
    editDiv.style.display = 'block';
    editDiv.querySelector('.ed_save').onclick = (ev) => {
      ev.stopPropagation();
      e.commonName = editDiv.querySelector('.ed_common').value.trim();
      e.scientificName = editDiv.querySelector('.ed_sci').value.trim();
      e.identifier = editDiv.querySelector('.ed_ident').value.trim();
      e.idDate = editDiv.querySelector('.ed_iddate').value.trim();
      e.country = editDiv.querySelector('.ed_country').value.trim();
      e.state = editDiv.querySelector('.ed_state').value.trim();
      e.municipality = editDiv.querySelector('.ed_muni').value.trim();
      e.locality = editDiv.querySelector('.ed_loc').value.trim();
      e.collectionDate = editDiv.querySelector('.ed_date').value.trim();
      e.collector = editDiv.querySelector('.ed_coll').value.trim();
      e.collectionNumber = editDiv.querySelector('.ed_num').value.trim();
      e.herbariumNumber = editDiv.querySelector('.ed_herb').value.trim();
      e.imageNumber = editDiv.querySelector('.ed_img').value.trim();
      e.obs = editDiv.querySelector('.ed_obs').value.trim();
      saveEntries();
      renderLedger();
    };
    editDiv.querySelector('.ed_delete').onclick = (ev) => {
      ev.stopPropagation();
      entries = entries.filter(x => x.id !== id);
      saveEntries();
      renderLedger();
    };
  }

  // ---------- exportação ----------
  function exportToXlsx() {
    const rows = entries.map(e => ({
      'Nome Popular': e.commonName || '',
      'Nome Científico': e.scientificName || '',
      'Determinador (Det.)': e.identifier || '',
      'Data de Determinação': e.idDate || '',
      'País': e.country || '',
      'Estado': e.state || '',
      'Município': e.municipality || '',
      'Local': e.locality || '',
      'Data de Coleta': e.collectionDate || '',
      'Coletor': e.collector || '',
      'Nº de Campo': e.collectionNumber || '',
      'Registro no Herbário': e.herbariumNumber || '',
      'Registro da Imagem': e.imageNumber || '',
      'Observações': e.obs || '',
      'Texto Bruto do OCR': e.rawText || ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      { wch: 18 }, { wch: 22 }, { wch: 18 }, { wch: 16 }, { wch: 10 }, { wch: 12 },
      { wch: 14 }, { wch: 30 }, { wch: 14 }, { wch: 18 }, { wch: 10 }, { wch: 16 },
      { wch: 16 }, { wch: 24 }, { wch: 50 }
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Amostras');
    XLSX.writeFile(wb, 'caderno-de-campo-' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }

  // ---------- utilitários ----------
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- eventos ----------
  el('camBtn').onclick = () => el('camInput').click();
  el('uploadBtn').onclick = () => el('fileInput').click();
  el('camInput').onchange = (e) => { if (e.target.files[0]) processImage(e.target.files[0]); e.target.value = ''; };
  el('fileInput').onchange = (e) => { if (e.target.files[0]) processImage(e.target.files[0]); e.target.value = ''; };
  exportBtn.onclick = exportToXlsx;

  loadEntries();
})();
</script>
</body>
</html>
